<body>
  <br>
  <br>
  <h1>
    Caesar Cryptographer<hr size= 5>
    
  </h1>
  <br>
  <br>
  <br>
<input id="text" placeholder="Message">
<input id="shift" type="number" placeholder="Shift">
  <br>
  <br>
<button onclick="run()">Encrypt</button>
  <button onclick="decrypt()">Decrypt</button>
  
  <br>
  <br>
  <br>
  <div class="idea-box"; id= "output"></div>

<output id="output">

<script>
function run() {
  let text = document.getElementById("text").value;
  let shift = Number(document.getElementById("shift").value);
  let result = "";

  let lower = "abcdefghijklmnopqrstuvwxyz";
  let upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  for (let ch of text) {
    if (lower.includes(ch)) {
      result += lower[(lower.indexOf(ch) + shift) % 26];
    } else if (upper.includes(ch)) {
      result += upper[(upper.indexOf(ch) + shift) % 26];
    } else {
      result += ch;
    }
  }

  document.getElementById("output").innerText = result;
}
  
  
  function decrypt() {
  let text = document.getElementById("text").value;
  let shift = Number(document.getElementById("shift").value);
  let result = "";

  let lower = "abcdefghijklmnopqrstuvwxyz";
  let upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  for (let ch of text) {
    if (lower.includes(ch)) {
      result += lower[(lower.indexOf(ch) - shift) % 26];
    } else if (upper.includes(ch)) {
      result += upper[(upper.indexOf(ch) - shift) % 26];
    } else {
      result -= ch;
    }
  }
    document.getElementById("output").innerText = result;
}
  
</script>
